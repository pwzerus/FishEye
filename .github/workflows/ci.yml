# Continuous integration: on every push and pull request, GitHub runs this on
# a clean machine, so "works on my laptop" has to mean "works from the repo".
#
#   backend   lint + the test suite, on SQLite and again on PostgreSQL/PostGIS
#   frontend  lint + tests + a production build
#   docker    builds both images, starts the whole stack with Docker Compose
#             and checks that it answers
#
# Nothing here deploys anything or needs a secret.

name: CI

on:
  push:
  pull_request:

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # The same PostGIS image docker-compose.yml uses. Its role is a
    # superuser, as in that image, so the app's CREATE EXTENSION postgis works.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fisheye
          POSTGRES_PASSWORD: fisheye
          POSTGRES_DB: fisheye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fisheye -d fisheye_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests on SQLite (the default, in memory)
        run: python -m pytest -q
      - name: Tests on PostgreSQL + PostGIS (what a deployment uses)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fisheye:fisheye@localhost:5432/fisheye_test
        run: python -m pytest -q

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # src/ only: scripts/ holds a one-off CommonJS data script that the
      # no-require-imports rule rejects by design.
      - name: Lint
        run: npx eslint src
      - name: Tests
        run: npm test
      # `next build` also type-checks the whole app. The API URL is a
      # placeholder: no page needs a backend at build time.
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the whole stack
        # --wait returns once every service with a health check is healthy.
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API is up and has the seeded lakes
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          lakes=$(curl --fail --silent --show-error "http://localhost:8000/api/waterbodies?limit=5")
          echo "$lakes" | grep -q "Lake Fork"
      - name: Guide Q&A answers a look-alike question from the guides
        run: |
          answer=$(curl --fail --silent --show-error -X POST http://localhost:8000/api/ask \
            -H "content-type: application/json" \
            -d '{"question":"how do I tell white bass from hybrid striped bass"}')
          echo "$answer" | grep -q "white-bass#identification"
      - name: Web pages render with data from the API
        # Server-rendered inside the frontend container, which can only get
        # this data through API_INTERNAL_URL (http://backend:8000). If it
        # couldn't reach the API, the pages say so instead of showing data.
        run: |
          fish=$(curl --fail --silent --show-error http://localhost:3000/fish)
          echo "$fish" | grep -q "Black Crappie"
          guide=$(curl --fail --silent --show-error http://localhost:3000/fish/blue-catfish)
          echo "$guide" | grep -q "How to recognise it"
          map=$(curl --fail --silent --show-error http://localhost:3000/map)
          if echo "$map" | grep -q "Could not reach the backend"; then
            echo "The map page could not reach the API" >&2
            exit 1
          fi
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
